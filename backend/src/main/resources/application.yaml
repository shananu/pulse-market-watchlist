spring:
  application:
    name: pulse-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/pulse
    username: pulse
    password: pulse
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info