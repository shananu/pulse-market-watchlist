services:
  postgres:
    image: postgres:17
    container_name: pulse-postgres
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5433:5432"
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "6379:6379"
    volumes:
      - pulse-redis-data:/data

volumes:
  pulse-postgres-data:
  pulse-redis-data: